<style>
/* Layout: ledger-style admin console + focused exam screen; one accent (deep teal), semantic green/red only for 1/0 marks */
:root{
  --bg:#f2f5f1; --surface:#ffffff; --surface2:#e8eee7; --ink:#14221e; --muted:#586a63; --line:#d2dbd4;
  --accent:#0e6a5b; --accent-ink:#ffffff; --accent-soft:#d5ebe5;
  --good:#1c7a45; --good-bg:#d9f0e2; --bad:#b3261e; --bad-bg:#f8dbd8; --warn:#8a5a00; --warn-bg:#faebc8;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Onest","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1412; --surface:#151f1c; --surface2:#1c2925; --ink:#e4ede9; --muted:#93a59e; --line:#2a3a35;
  --accent:#4cc2a6; --accent-ink:#06201a; --accent-soft:#17382f;
  --good:#58d08b; --good-bg:#14301f; --bad:#ff8a80; --bad-bg:#3a1a18; --warn:#f0b24a; --warn-bg:#3a2b0e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1412; --surface:#151f1c; --surface2:#1c2925; --ink:#e4ede9; --muted:#93a59e; --line:#2a3a35;
  --accent:#4cc2a6; --accent-ink:#06201a; --accent-soft:#17382f;
  --good:#58d08b; --good-bg:#14301f; --bad:#ff8a80; --bad-bg:#3a1a18; --warn:#f0b24a; --warn-bg:#3a2b0e; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  margin:0;padding:0}
.wrap{max-width:1180px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
body[data-v="home"] .wrap{max-width:none;padding:0}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.02em}
h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
h3{font-size:16px;font-weight:700}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint{color:var(--muted);font-size:13.5px;max-width:68ch}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.logo{flex:none;width:56px;height:56px;display:block;object-fit:contain}
.runbar .logo{width:44px;height:44px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wave .wd{display:inline-block;white-space:nowrap;margin-right:.28em}
.wave .lt{display:inline-block;animation:bob 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*-110ms)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-.07em) rotate(-2.5deg)}75%{transform:translateY(.06em) rotate(2.5deg)}}

.primary,.ghost,.danger,.chip{border-radius:8px;padding:9px 16px;border:1px solid transparent;font-weight:600;line-height:1.2}
.primary{background:var(--accent);color:var(--accent-ink)}
.primary:hover:not(:disabled){filter:brightness(1.08)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.ghost:hover{background:var(--surface2)}
.danger{background:transparent;border-color:var(--bad);color:var(--bad);padding:5px 10px;font-size:13px}
.danger:hover{background:var(--bad-bg)}
.sm{padding:5px 10px;font-size:13px}

.note{margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13.5px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px;margin-bottom:16px;min-width:0}
.narrow{max-width:520px;margin-inline:auto}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.field{display:grid;gap:5px;min-width:0}
.field>label,.lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input[type=text],input[type=password],input[type=number],select{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);min-height:42px}
input[type=file]{width:100%;padding:8px;border:1px dashed var(--line);border-radius:8px;background:var(--surface2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.err{color:var(--bad);font-size:13.5px;font-weight:500}
.okmsg{color:var(--good);font-size:13.5px;font-weight:500}

.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface2);border-color:var(--line);padding:6px 12px;font-size:13.5px}
.chip i{font-style:normal;font-family:var(--f-mono);color:var(--muted);margin-left:4px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.on i{color:var(--accent-ink)}
.preview{background:var(--accent-soft);border-radius:10px;padding:14px;display:grid;gap:10px}
.list{display:grid;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.li:last-child{border-bottom:0}
.li small{color:var(--muted)}
.scroll{overflow-x:auto;max-width:100%}
.qitem{padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.qitem ol{margin:6px 0 0;padding-left:22px;color:var(--muted)}
.qitem li.c{color:var(--good);font-weight:600}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--surface2);font-size:12.5px;font-family:var(--f-mono)}

table{border-collapse:collapse;width:100%}
.tt{font-size:13px}
.tt th,.tt td{border:1px solid var(--line);padding:5px 6px;text-align:center;white-space:nowrap}
.tt th{background:var(--surface2);font-weight:600}
.tt td.nm{text-align:left;min-width:200px;white-space:normal;position:sticky;left:0;background:var(--surface);z-index:1}
.tt th.nm{position:sticky;left:0;z-index:2}
.tt td.g{border-left:2px solid var(--ink)}
.tt .n1{background:var(--good-bg);color:var(--good);font-family:var(--f-mono);font-weight:600;min-width:28px}
.tt .n0{background:var(--bad-bg);color:var(--bad);font-family:var(--f-mono);font-weight:600;min-width:28px}
.tt .tot{font-family:var(--f-mono);font-weight:600}
.tt .pc td{background:var(--surface2);font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.sumgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:2px}
.stat b{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.comm{display:grid;gap:10px;margin-top:8px;padding-top:14px;border-top:2px solid var(--ink)}
.ctab th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--ink)}
.ctab td{border-bottom:1px solid var(--line);padding:6px 8px}
.ctab td:first-child{font-weight:600;white-space:nowrap;width:1%}
.ctab .sig{width:34%;height:54px}
.cin{border:0!important;background:transparent!important;padding:6px 2px!important;border-radius:0!important;border-bottom:1px dashed var(--line)!important}

/* test run */

/* ---------- parsing ---------- */
function parseQuestions(text){
  var lines=text.replace(/\r/g,'').split('\n').map(function(s){return s.trim()}).filter(Boolean);
  var out=[],cur=null,skipped=0;
  function close(){if(cur){if(cur.o.length>=2&&cur.q){if(cur.c<0)cur.c=0;out.push(cur)}else skipped++}cur=null}
  lines.forEach(function(ln){
    if(ln.charAt(0)==='#'){close();cur={q:ln.replace(/^#+\s*/,''),o:[],c:-1};return}
    if(!cur)return;
    if(/^[-–—+]/.test(ln)){
      var t=ln.replace(/^[-–—]\s*/,''),ok=false;
      if(t.charAt(0)==='+'){ok=true;t=t.replace(/^\+\s*/,'')}
      if(t){cur.o.push(t);if(ok)cur.c=cur.o.length-1}
    }else{
      if(cur.o.length)cur.o[cur.o.length-1]+=' '+ln;else cur.q+=' '+ln;
    }
  });
  close();
  return {qs:out,skipped:skipped};
}
function parseStudents(rows){
  var groups={},count=0,skipped=0;
  rows.forEach(function(r){
    var a=String(r[0]==null?'':r[0]).trim(),b=String(r[1]==null?'':r[1]).trim();
    if(!a&&!b)return;
    var m=a.match(/(\d{1,2})/);var n=m?parseInt(m[1],10):0;
    if(!b||n<1||n>11){skipped++;return}
    var label=/[A-Za-zА-яЁё]/.test(a)?a:'';
    (groups[n]=groups[n]||[]).push({n:b,l:label});count++;
  });
  return {groups:groups,count:count,skipped:skipped};
}

async function pwHash(pw,salt){
  try{
    var enc=new TextEncoder();
    var key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
    var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:60000,hash:'SHA-256'},key,256);
    return Array.prototype.map.call(new Uint8Array(bits),function(b){return ('0'+b.toString(16)).slice(-2)}).join('');
  }catch(e){return 'x'+cyrb(pw+'|'+salt)+cyrb(salt+'|'+pw)}
}

function runDots(r){
  var out='';
  r.subs.forEach(function(s,si){
    out+='<div class="grp"><span class="lbl" title="'+esc(s.name)+'">'+esc(s.name)+'</span><div class="dots">';
    for(var i=0;i<15;i++){var n=si*15+i,q=r.qs[n];
      if(!q)continue;
      out+='<button class="dot'+(q.a>=0?' a':'')+(n===r.cur?' cur':'')+'" data-act="goq" data-i="'+n+'" aria-label="'+(n+1)+'-savol, '+(q.a>=0?'belgilangan':'belgilanmagan')+'">'+(n+1)+'</button>'}
    out+='</div></div>';
  });
  return out;
}
function runCount(r){return r.qs.filter(function(q){return q.a>=0}).length}

var timerH=null;
function tick(){
  var r=ui.run;if(!r)return;
  var left=r.start+r.dur-Date.now();
  var t=$('#timer');
  if(left<=0){clearInterval(timerH);finish(true);return}
  var s=Math.ceil(left/1000),m=Math.floor(s/60);
  if(t){t.textContent=('0'+m).slice(-2).length>2?m+':'+('0'+(s%60)).slice(-2):('0'+m).slice(-2)+':'+('0'+(s%60)).slice(-2);t.className='timer'+(left<5*60000?' low':'')}
}

  var r=ui.run;

  var c=$('#cnt');if(c)c.textContent=runCount(r)+' / '+r.qs.length;

function goq(i){ui.run.cur=i;saveRun();$('#runBody').innerHTML=vRunBody();window.scrollTo({top:0})}
function buildRun(test,cls,name){
  var subs=test.subs.map(function(id){return {id:id,name:D.bank[id].name}}),qs=[];
  test.subs.forEach(function(id,si){
    shuffle(D.bank[id].qs.slice()).slice(0,15).forEach(function(q){
      var idx=shuffle(q.o.map(function(_,i){return i}));
      qs.push({si:si,t:q.q,o:idx.map(function(i){return q.o[i]}),c:idx.indexOf(q.c),a:-1});
    });
  });
  return {testId:tid(cls,test.q,test.b),rid:'r_'+tid(cls,test.q,test.b)+'_'+cyrb(cls+'|'+name),cls:cls,q:test.q,b:test.b,name:name,start:Date.now(),dur:90*60000,subs:subs,qs:qs,cur:0};
}
async function finish(auto){
  var r=ui.run;if(!r||ui.busy)return;
  ui.busy=true;
  var subs=r.subs.map(function(s){return {id:s.id,n:s.name,r:[]}});
  r.qs.forEach(function(q){subs[q.si].r.push(q.a===q.c?1:0)});
  var c=0;subs.forEach(function(s){s.r.forEach(function(x){c+=x})});
  var tot=r.qs.length;
  var doc={t:r.testId,cls:r.cls,name:r.name,ts:Date.now(),subs:subs,c:c,w:tot-c,tot:tot,sc:Math.round(c/tot*1000)/10,auto:!!auto};
  var ok=await safe(function(){return put('results',r.rid,doc)});
  ui.busy=false;
  if(!ok){var b=$('#finBox');if(b)b.innerHTML='<div class="err">Natijani saqlab bo\'lmadi. Internetni tekshirib, yana «Yakunlash» tugmasini bosing.</div>';return}
  clearInterval(timerH);lsDel('mon_run');ui.run=null;ui.last=doc;ui.view='done';ui.confirmFin=false;render();window.scrollTo({top:0});
}

function render(){
  var v=ui.view,h;
  if(!loaded){return}
  document.body.setAttribute('data-v',v);
  try{
    if(v==='home')h=vHome();else if(v==='about')h=vAbout();else if(v==='auth')h=vAuth();else if(v==='student')h=vStudent();else if(v==='run')h=vRun();else if(v==='done')h=vDone();else h=vAdmin();
  }catch(err){
    h='<div class="panel"><h2>Bo\'limni ko\'rsatib bo\'lmadi</h2><p class="err">'+esc(err&&err.message||err)+'</p></div>';
  }
  $('#hdr').innerHTML=(v==='run'?'':header());
  $('#app').innerHTML=h;
  $('#ftr').innerHTML=(v==='home'?footer():'');

async function act(a,el){
  var f=ui.f;
  switch(a){
    case 'home':if(ui.view==='run')return;ui.view='home';ui.codeOpen=false;ui.f.sn='';render();break;
    case 'goAbout':ui.view='about';render();window.scrollTo({top:0});break;
    case 'tgStaff':{ui.so=ui.so||{};var kk=el.dataset.k;ui.so[kk]=!ui.so[kk];el.classList.toggle('open',!!ui.so[kk]);break}
    case 'goStudent':ui.view='student';ui.codeOpen=false;render();break;
    case 'goAdmin':
      var saved=lsGet('mon_admin');
      if(saved&&admins().some(function(x){return x.u===saved})){ui.admin=saved;ui.view='admin'}else{ui.view='auth';ui.authErr=''}
      render();break;
    case 'logout':lsDel('mon_admin');ui.admin=null;ui.view='home';render();break;
    case 'register':{
      var u=(f.au||'').trim(),p=f.ap||'';
      if(admins().length){return}
      if(u.length<3){ui.authErr="Login kamida 3 belgidan iborat bo'lsin.";render();return}
      if(p.length<6){ui.authErr="Parol kamida 6 belgidan iborat bo'lsin.";render();return}
      if(p!==f.ap2){ui.authErr='Parollar bir xil emas.';render();return}
      var salt=cyrb(u+Date.now()+Math.random()),h=await pwHash(p,salt);
      if(await safe(function(){return put('cfg','admins',{list:[{u:u,s:salt,h:h}]})})){lsSet('mon_admin',u);ui.admin=u;ui.view='admin';ui.f.ap='';ui.f.ap2='';render()}
      break}
    case 'login':{
      var u2=(f.au||'').trim(),acc=admins().filter(function(x){return x.u===u2})[0];
      if(!acc||(await pwHash(f.ap||'',acc.s))!==acc.h){ui.authErr="Login yoki parol noto'g'ri.";render();return}
      lsSet('mon_admin',u2);ui.admin=u2;ui.view='admin';ui.f.ap='';render();break}
    case 'tab':ui.tab=el.dataset.t;render();break;
    case 'pickCls':ui.openCls=el.dataset.c;render();break;
    case 'impCancel':ui.imp=null;render();break;
    case 'impApply':{
      var g=ui.imp.groups,ks=Object.keys(g),okAll=true;
      for(var i=0;i<ks.length;i++){if(!(await safe(function(){return put('students','c'+ks[i],{list:g[ks[i]]})}))){okAll=false;break}}
      if(okAll){toast(ui.imp.count+" ta o'quvchi qo'shildi");ui.imp=null;render()}
      break}
    case 'delSt':{var l=stList(ui.openCls).slice();l.splice(+el.dataset.i,1);await safe(function(){return put('students','c'+ui.openCls,{list:l})});break}
    case 'clearCls':await safe(function(){return del('students','c'+ui.openCls)});break;
    case 'subCancel':ui.subImp=null;render();break;
    case 'subSave':{
      var name=(f.subName||'').trim();
      if(!name){toast('Fan nomini kiriting.','err');return}
      var ex=bankList().filter(function(b){return b.name.toLowerCase()===name.toLowerCase()})[0];
      var id=ex?ex.id:'s'+Date.now().toString(36),qs=ex?ex.qs.slice():[],seen={};
      qs.forEach(function(q){seen[q.q]=1});
      ui.subImp.qs.forEach(function(q){if(!seen[q.q]){qs.push(q);seen[q.q]=1}});
      if(JSON.stringify(qs).length>240000){toast("Savollar hajmi juda katta. Faylni bo'laklarga bo'ling.",'err');return}
      if(await safe(function(){return put('bank',id,{name:ex?ex.name:name,qs:qs})})){toast(name+': '+qs.length+' ta savol saqlandi');ui.subImp=null;ui.f.subName='';render()}
      break}
    case 'viewSub':ui.openSub=ui.openSub===el.dataset.id?null:el.dataset.id;render();break;
    case 'delSub':{
      var used=Object.keys(D.tests).some(function(k){return D.tests[k].subs.indexOf(el.dataset.id)>=0});
      if(used){toast("Bu fan tuzilgan testlarda ishlatilgan. Avval testlarni o'chiring.",'err');return}
      await safe(function(){return del('bank',el.dataset.id)});break}
    case 'addBlock':{
      var cb=D.cfg.blocks||{},lb=cb.list||[],nid=Math.max(cb.next||4,lb.reduce(function(m,x){return Math.max(m,+x.id)},3)+1),nm=(f.bn||'').trim()||(nid+'-blok');
      if(blocks().some(function(o){return o.name.toLowerCase()===nm.toLowerCase()})){toast('Bunday blok mavjud.','err');return}
      if(await safe(function(){return put('cfg','blocks',{list:lb.concat([{id:nid,name:nm}]),next:nid+1})})){ui.f.bn='';toast(nm+' qo\'shildi');render()}
      break}
    case 'delBlock':{
      var bid=+el.dataset.id,cb2=D.cfg.blocks||{};
      if(Object.keys(D.tests).some(function(k){return +D.tests[k].b===bid})){toast("Bu blok uchun test tuzilgan. Avval testni o'chiring.",'err');return}
      var lb2=(cb2.list||[]).filter(function(x){return +x.id!==bid});
      await safe(function(){return put('cfg','blocks',{list:lb2,next:cb2.next||(bid+1)})});break}
    case 'genCode':ui.f.code=String(Math.floor(1000+Math.random()*9000));render();break;
    case 'saveTest':{
      var ids=[f.s1,f.s2,f.s3].filter(Boolean);
      if(!ids.length){toast('Kamida 1 ta fanni tanlang.','err');return}
      if(new Set(ids).size<ids.length){toast('Fanlar bir-biridan farq qilsin.','err');return}
      var short=ids.filter(function(x){return (D.bank[x].qs||[]).length<15});
      if(short.length){toast(D.bank[short[0]].name+" fanida kamida 15 ta savol bo'lishi kerak.",'err');return}
      if(!(f.code||'').trim()){toast('Kirish kodini kiriting.','err');return}
      var t={cls:+f.tc,q:+f.tq,b:+f.tb,subs:ids,com:comObj(),code:f.code.trim(),ts:Date.now()};
      if(await safe(function(){return put('tests',tid(t.cls,t.q,t.b),t)})){toast(t.cls+'-sinf, '+t.q+'-chorak, '+bName(t.b)+' testi saqlandi');render()}
      break}
    case 'editTest':{var t2=D.tests[el.dataset.id];ui.f.tc=t2.cls;ui.f.tq=t2.q;ui.f.tb=t2.b;COM.forEach(function(r){ui.f['tm_'+r[0]]=(t2.com&&t2.com[r[0]])||''});ui.f.s1=t2.subs[0]||'';ui.f.s2=t2.subs[1]||'';ui.f.s3=t2.subs[2]||'';ui.f.code=t2.code;render();window.scrollTo({top:0});break}
    case 'delTest':await safe(function(){return del('tests',el.dataset.id)});break;
    case 'delRes':await safe(function(){return del('results',el.dataset.id)});break;
    case 'exportXlsx':exportXlsx();break;
    case 'addAdmin':{
      var nu=(f.nu||'').trim(),np=f.np||'';
      if(nu.length<3||np.length<6){toast("Login kamida 3, parol kamida 6 belgidan iborat bo'lsin.",'err');return}
      if(admins().some(function(x){return x.u===nu})){toast('Bunday login mavjud.','err');return}
      var s3=cyrb(nu+Date.now()+Math.random()),h3=await pwHash(np,s3),nl=admins().concat([{u:nu,s:s3,h:h3}]);
      if(await safe(function(){return put('cfg','admins',{list:nl})})){ui.f.nu='';ui.f.np='';toast('Admin qo\'shildi');render()}
      break}
    case 'delAdmin':{var nl2=admins().slice();nl2.splice(+el.dataset.i,1);await safe(function(){return put('cfg','admins',{list:nl2})});break}
    case 'startOpen':ui.codeOpen=true;ui.codeErr='';render();break;
    case 'codeCancel':ui.codeOpen=false;render();break;
    case 'startGo':{
      var test=D.tests[tid(f.sc,f.sq,f.sb)],code=($('#codeIn').value||'').trim();
      if(!test)return;
      if(code.toLowerCase()!==String(test.code).toLowerCase()){ui.codeErr="Kirish kodi noto'g'ri.";render();return}
      if(test.subs.some(function(s){return !D.bank[s]||D.bank[s].qs.length<15})){ui.codeErr="Test savollari to'liq emas. Adminga murojaat qiling.";render();return}
      ui.run=buildRun(test,f.sc,f.sn);saveRun();ui.view='run';ui.codeOpen=false;ui.confirmFin=false;render();window.scrollTo({top:0});break}
    case 'goq':goq(+el.dataset.i);break;
    case 'prevq':if(ui.run.cur>0)goq(ui.run.cur-1);break;
    case 'nextq':if(ui.run.cur<ui.run.qs.length-1)goq(ui.run.cur+1);break;
    case 'finishAsk':{
      var fb=$('#finBox');
      fb.innerHTML='<div class="confirm"><span>Testni yakunlaysizmi? Keyin javoblarni o\'zgartirib bo\'lmaydi.</span><div class="row"><button class="primary sm" data-act="finishGo">Ha, yakunlash</button><button class="ghost sm" data-act="finishNo">Qaytish</button></div></div>';break}
    case 'finishNo':$('#finBox').innerHTML='';break;
    case 'finishGo':finish(false);break;
  }
}
async function exportXlsx(){
  var f=ui.f,tId=tid(f.rc,f.rq,f.rb),test=D.tests[tId],rs=resRows(tId);
  if(!test||typeof XLSX==='undefined')return;
  var names=test.subs.map(function(s){return D.bank[s]?D.bank[s].name:'—'});
  var jami=stList(f.rc).length,qat=rs.length,N=rs.length||1;
  var aoa=[['SINF:',+f.rc],['CHORAK / BLOK:',f.rq+'-chorak, '+bName(f.rb)+''],["JAMI O'QUVCHILAR:",jami],['QATNASHDI:',qat],['QATNASHMADI:',Math.max(0,jami-qat)],["Monitoring raisi:",(test.com&&test.com.chair)||''],[]];
  var h1=['№',"O'quvchi F.I.SH"],h2=['',''],merges=[];
  names.forEach(function(n,s){h1.push(n);for(var i=1;i<17;i++)h1.push('');for(var j=1;j<=15;j++)h2.push(j);h2.push("TO'G'RI JAVOBLAR",'BALL')});
  h1.push("To'g'ri","Noto'g'ri",'Ball');h2.push('','','');
  var hr=aoa.length;aoa.push(h1,h2);
  names.forEach(function(_,s){merges.push({s:{r:hr,c:2+s*17},e:{r:hr,c:18+s*17}})});
  for(var c=0;c<2;c++)merges.push({s:{r:hr,c:c},e:{r:hr+1,c:c}});
  var oc=2+names.length*17;for(var c2=oc;c2<oc+3;c2++)merges.push({s:{r:hr,c:c2},e:{r:hr+1,c:c2}});
  var tot=names.map(function(){return {c:0,b:0}}),qc=[];
  for(var s0=0;s0<names.length;s0++){qc.push([]);for(var i0=0;i0<15;i0++)qc[s0].push(0)}
  rs.forEach(function(r,n){var row=[n+1,r.name];for(var s=0;s<names.length;s++){var arr=(r.subs[s]&&r.subs[s].r)||[],cs=0;for(var i=0;i<15;i++){var v=arr[i]?1:0;cs+=v;qc[s][i]+=v;row.push(v)}var bl=cs/15*100;tot[s].c+=cs;tot[s].b+=bl;row.push(cs,Math.round(bl*100)/100)}row.push(r.c,r.w,r.sc);aoa.push(row)});
  var pr=['',"To'g'ri javob, %"],sm=['',"Yig'indi (to'g'ri javoblar / ballar)"],av=['',"Umumiy fan ko'rsatkichi (yig'indi / qatnashganlar soni)"];
  for(var s5=0;s5<names.length;s5++){for(var i5=0;i5<15;i5++){pr.push(Math.round(qc[s5][i5]/N*100));sm.push('');av.push('')}pr.push('','');sm.push(tot[s5].c,Math.round(tot[s5].b*100)/100);av.push(Math.round(tot[s5].c/N*100)/100,Math.round(tot[s5].b/N*100)/100)}
  if(rs.length)aoa.push(pr,sm,av);
  var cm=test.com||{};
  aoa.push([],['Monitoring komissiyasi'],['Lavozim','F.I.SH','Imzo'],['Monitoring raisi',cm.chair||'',''],['Kotibi',cm.sec||'','']);
  for(var k=0;k<4;k++)aoa.push(["A'zo "+(k+1),cm['m'+k]||'','']);
  var ws=XLSX.utils.aoa_to_sheet(aoa);ws['!merges']=merges;
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Natijalar');
  var buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  var fname='natijalar-'+f.rc+'-sinf-'+f.rq+'-chorak-'+bName(f.rb).replace(/[\\\/:*?"<>|\s]+/g,'_')+'.xlsx';
  if(!DL){
    try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download=fname;document.body.appendChild(a);a.click();a.remove();toast('Fayl yuklab olindi')}
    catch(e){toast("Faylni saqlab bo'lmadi.",'err')}
    return;
  }
  try{await DL.save({filename:fname,data:buf});toast('Fayl saqlandi')}
  catch(e){if(!e||e.code!=='declined')toast("Faylni saqlab bo'lmadi.",'err')}
}

document.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(t&&!t.disabled)act(t.dataset.act,t)});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.k){ui.f[t.dataset.k]=t.value;if(t.dataset.k==='nameQ')refreshNames()}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.name==='qopt'&&ui.run){ui.run.qs[ui.run.cur].a=+t.value;saveRun();refreshRun();return}
  if(t.dataset&&t.dataset.k){
    ui.f[t.dataset.k]=t.value;
    if(t.dataset.k==='sc'){ui.f.sn='';ui.f.nameQ='';ui.codeOpen=false}
    if(t.dataset.k==='sn'||t.dataset.k==='sq'||t.dataset.k==='sb')ui.codeOpen=false;
    if(t.dataset.k==='tb')COM.forEach(function(r){delete ui.f['tm_'+r[0]]});
    if(t.dataset.re!==undefined)render();
    return;
  }
  if(t.dataset&&t.dataset.cm){var tId0=tid(ui.f.rc,ui.f.rq,ui.f.rb),t0=D.tests[tId0];if(t0){var c=Object.assign({},t0.com||{});c[t.dataset.cm]=t.value.trim();safe(function(){return put('tests',tId0,Object.assign({},t0,{com:c}))})}return}
  if(t.dataset&&t.dataset.resp!==undefined){
    var tId=tid(ui.f.rc,ui.f.rq,ui.f.rb),test=D.tests[tId];
    if(test)safe(function(){return put('tests',tId,Object.assign({},test,{resp:t.value.trim()}))});return}
  if(t.id==='fStu'&&t.files[0])readStudents(t.files[0]);
  if(t.id==='fSub'&&t.files[0])readSubject(t.files[0]);
});
async function readStudents(file){
  try{
    var buf=await file.arrayBuffer(),wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];
    var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''}),p=parseStudents(rows);
    ui.imp={file:file.name,groups:p.groups,count:p.count,skipped:p.skipped};
    if(!p.count)toast("Fayldan o'quvchi topilmadi. 1-ustunda sinf, 2-ustunda F.I.SH bo'lishi kerak.",'err');
    render();
  }catch(e){toast("Faylni o'qib bo'lmadi: "+(e&&e.message||e),'err')}
}
async function readSubject(file){
  try{
    var buf=await file.arrayBuffer(),text;
    if(/\.docx$/i.test(file.name)){var r=await mammoth.extractRawText({arrayBuffer:buf});text=r.value}else text=dec(buf);
    var p=parseQuestions(text);
    ui.subImp={file:file.name,qs:p.qs,skipped:p.skipped};
    if(!ui.f.subName)ui.f.subName=file.name.replace(/\.[^.]+$/,'');
    if(!p.qs.length)toast("Savollar topilmadi. Savol # bilan, variantlar - bilan boshlanishi kerak.",'err');
    render();
  }catch(e){toast("Faylni o'qib bo'lmadi: "+(e&&e.message||e),'err')}
}
